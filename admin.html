<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathsPal Admin - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 font-sans p-4 md:p-10 text-slate-900 pb-20 leading-relaxed">
    <div class="max-w-7xl mx-auto space-y-8">
        
        <!-- HEADER -->
        <div class="flex justify-between items-center bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100">
            <h1 class="text-3xl font-black italic tracking-tighter">Maths<span class="text-yellow-500 underline">Pal</span></h1>
            <div class="text-right">
                <p id="teacherNameDisplay" class="font-black text-sm text-slate-600 italic">Professor</p>
                <div id="proBadge" class="hidden animate-bounce inline-block bg-blue-100 text-blue-600 px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-widest mt-1">💎 PRO MEMBER</div>
            </div>
        </div>

        <!-- GO PRO BANNER -->
        <div id="pro-card" class="bg-gradient-to-br from-blue-600 to-indigo-900 p-8 rounded-[2.5rem] shadow-2xl text-white relative overflow-hidden">
            <div class="relative z-10 space-y-4">
                <h2 class="text-3xl font-black italic">Unlock MathsPal Pro 🚀</h2>
                <p class="text-sm opacity-80 max-w-sm font-medium">Get unlimited quizzes and detailed analytics for KSh 500/month.</p>
                <button onclick="triggerPayment()" id="mpesaBtn" class="bg-yellow-400 text-slate-900 px-8 py-4 rounded-2xl font-black uppercase tracking-widest shadow-lg active:scale-95 transition">Upgrade with M-Pesa</button>
            </div>
            <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-white/10 rounded-full"></div>
        </div>
        
        <!-- QUIZ CREATOR -->
        <details class="bg-slate-900 rounded-3xl overflow-hidden shadow-xl border-b-4 border-yellow-500 max-w-md">
            <summary class="p-5 font-black text-xs uppercase cursor-pointer text-yellow-400 text-center tracking-widest">➕ Create New Quiz</summary>
            <div class="bg-white p-6 space-y-4 rounded-b-3xl text-center border-t">
                <input id="title" type="text" placeholder="Quiz Title" class="w-full p-4 border-2 border-slate-50 rounded-2xl outline-none font-bold bg-slate-50 focus:border-yellow-400">
                <div id="q-list"><div class="flex gap-2 mb-2"><input class="w-12 p-3 border rounded-xl q-num bg-white text-center font-black" value="1" readonly><input class="flex-1 p-3 border rounded-xl q-ans font-bold text-center uppercase" placeholder="Ans"></div></div>
                <button onclick="addQ()" class="text-blue-600 font-black text-[10px] uppercase tracking-tighter">+ Add Question</button>
                <button id="saveBtn" onclick="saveQuiz()" class="w-full py-4 bg-slate-900 text-yellow-400 rounded-2xl font-black shadow-lg uppercase">Generate Code</button>
                <div id="codeBox" class="hidden bg-yellow-400 p-6 rounded-[2rem] text-center mt-4 font-black text-3xl italic">CODE: <span id="finalCode">---</span></div>
            </div>
        </details>

        <div id="assignments-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8"></div>
        <button onclick="localStorage.clear(); window.location.href='login.html'" class="w-full py-10 text-slate-300 font-black text-[10px] uppercase tracking-[0.5em]">Sign Out</button>
    </div>

    <script>
        const API_URL = 'https://mathspal-backend.onrender.com';
        const S_URL = 'https://ykdehazdwinllvjsmrd.supabase.co'; 
        const S_KEY = 'sb_publishable_Usp4A-ts9B6wBS1_XxJjVA_IZpwPMCn'; 
        const supabaseClient = supabase.createClient(S_URL, S_KEY);

        // --- 1. PRO STATUS AUTOMATION ---
        async function checkProStatus() {
            const email = localStorage.getItem('mp_email');
            if (!email) return;

            const { data } = await supabaseClient.from('profiles').select('is_pro, full_name').eq('email', email).single();
            
            if (data && data.is_pro) {
                // VICTORY UI
                document.getElementById('proBadge').classList.remove('hidden');
                document.getElementById('pro-card').classList.add('hidden');
                document.getElementById('teacherNameDisplay').innerText = data.full_name;
            } else if (data) {
                document.getElementById('teacherNameDisplay').innerText = data.full_name;
            }
        }

        async function triggerPayment() {
            const phone = prompt("Enter M-Pesa Number (254...):");
            if (!phone) return;
            document.getElementById('mpesaBtn').innerText = "WAITING FOR PIN...";
            
            const fd = new FormData();
            fd.append('phone', phone);
            fd.append('email', localStorage.getItem('mp_email'));

            try {
                const res = await fetch(`${API_URL}/request-payment`, { method: 'POST', body: fd }).then(r => r.json());
                if (res.status === "success") {
                    alert("STK PUSH SENT! Enter your PIN. The dashboard will unlock automatically.");
                }
            } catch (e) { alert("Error."); }
        }

        async function loadDashboard() {
            const container = document.getElementById('assignments-container');
            const session = localStorage.getItem('mp_session');
            try {
                const [aRes, sRes] = await Promise.all([
                    fetch(`${API_URL}/assignments`, { headers: { 'Authorization': `Bearer ${session}` } }).then(r => r.json()),
                    fetch(`${API_URL}/submissions`, { headers: { 'Authorization': `Bearer ${session}` } }).then(r => r.json())
                ]);
                const assignments = aRes.data || [], allSubs = sRes.data || [];
                container.innerHTML = assignments.map(quiz => {
                    const subs = allSubs.filter(s => s.assignment_id === quiz.id);
                    const totalQs = Object.keys(quiz.master_key).length;
                    const avg = subs.length > 0 ? Math.round((subs.reduce((a,b) => a + (b.score || 0), 0) / (subs.length * totalQs)) * 100) : 0;
                    return `<div class="bg-white rounded-[2.5rem] shadow-xl border p-8 flex flex-col h-fit">
                        <h4 class="font-black text-slate-800 text-xl tracking-tighter uppercase leading-none">${quiz.title}</h4>
                        <span class="bg-yellow-100 text-yellow-800 text-[10px] font-black px-2 py-0.5 rounded-full uppercase mt-2 w-fit">${quiz.short_code}</span>
                        <div class="flex justify-between items-end mt-4"><p class="text-[24px] font-black ${avg < 50 ? 'text-red-500' : 'text-green-600'}">${avg}%</p><p class="text-xs font-bold text-slate-400">${subs.length} Students</p></div>
                    </div>`;
                }).join('');
            } catch (e) { console.log(e); }
        }

        function addQ() {
            const list = document.getElementById('q-list');
            const num = list.children.length + 1;
            const div = document.createElement('div');
            div.className = "flex gap-2 mt-2";
            div.innerHTML = `<input class="w-12 p-3 border rounded-xl q-num text-center font-black text-slate-300" value="${num}" readonly><input class="flex-1 p-3 border rounded-xl q-ans font-bold text-center uppercase" placeholder="Ans">`;
            list.appendChild(div);
        }

        async function saveQuiz() {
            const session = localStorage.getItem('mp_session');
            const answers = {};
            document.querySelectorAll('.q-ans').forEach((input, i) => { if(input.value) answers[i+1] = input.value; });
            const fd = new FormData();
            fd.append('title', document.getElementById('title').value);
            fd.append('master_key', JSON.stringify(answers));
            const res = await fetch(`${API_URL}/create-assignment`, { method: 'POST', body: fd, headers: { 'Authorization': `Bearer ${session}` } }).then(r => r.json());
            document.getElementById('finalCode').innerText = res.short_code;
            document.getElementById('codeBox').classList.remove('hidden');
            loadDashboard();
        }

        if (!localStorage.getItem('mp_session')) window.location.href = 'login.html';
        
        // --- START THE AUTO-CHECKERS ---
        checkProStatus(); // Check immediately
        loadDashboard();
        setInterval(checkProStatus, 5000); // Check for the Diamond every 5 seconds
        setInterval(loadDashboard, 15000); // Refresh grades every 15 seconds
    </script>
</body>
</html>
