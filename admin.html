<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathsPal Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 font-sans p-4 md:p-10 text-slate-900 pb-20 leading-relaxed">
    <!-- PERSISTENT LOADING OVERLAY -->
    <div id="loader" class="fixed inset-0 bg-white z-[100] flex flex-col items-center justify-center">
        <div class="border-4 border-slate-100 border-t-yellow-500 rounded-full w-12 h-12 animate-spin"></div>
        <p class="mt-4 font-black text-[10px] text-slate-400 uppercase tracking-widest">Waking up Engine...</p>
    </div>

    <div class="max-w-7xl mx-auto space-y-8">
        <div class="flex justify-between items-center bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100">
            <h1 class="text-3xl font-black italic tracking-tighter text-slate-800 leading-none">Maths<span class="text-yellow-500 underline">Pal</span></h1>
            <div class="text-right">
                <p id="teacherNameDisplay" class="font-black text-sm text-slate-600 italic">Connecting...</p>
                <div id="proBadge" class="hidden animate-bounce inline-block bg-blue-100 text-blue-600 px-3 py-1 rounded-full text-[9px] font-black uppercase tracking-widest mt-2 border border-blue-200">💎 PRO MEMBER</div>
            </div>
        </div>

        <div id="pro-card" class="hidden bg-gradient-to-br from-blue-600 to-indigo-900 p-8 rounded-[3rem] shadow-2xl text-white relative overflow-hidden">
            <div class="relative z-10 space-y-4">
                <h2 class="text-3xl font-black italic leading-tight text-white">Unlock Pro 🚀</h2>
                <button onclick="triggerPayment()" class="bg-yellow-400 text-slate-900 px-8 py-4 rounded-2xl font-black text-xs uppercase shadow-xl">Upgrade with M-Pesa</button>
            </div>
        </div>
        
        <div id="assignments-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>

        <button onclick="handleLogout()" class="w-full py-10 text-slate-300 hover:text-red-500 font-black text-[10px] uppercase tracking-[0.5em] transition">Sign Out</button>
    </div>

    <script>
        const API_URL = 'https://mathspal-backend.onrender.com';
        const S_URL = 'https://ykdehazdwinllvjsmrd.supabase.co'; 
        const S_KEY = 'sb_publishable_Usp4A-ts9B6wBS1_XxJjVA_IZpwPMCn'; 
        const supabaseClient = supabase.createClient(S_URL, S_KEY);

        async function init() {
            // 1. THE LOOP BREAKER: Look for the token in the URL #hash first
            const hash = window.location.hash.substring(1);
            const params = new URLSearchParams(hash);
            let token = params.get('access_token') || localStorage.getItem('mp_session');
            
            if (!token) {
                // Second check: Wait a moment for Supabase to restore session
                const { data } = await supabaseClient.auth.getSession();
                token = data.session?.access_token;
            }

            if (!token) {
                // Only redirect if absolutely no token is found
                window.location.href = 'login.html';
                return;
            }

            // 2. Save it for stability
            localStorage.setItem('mp_session', token);
            document.getElementById('loader').classList.add('hidden');

            // 3. Fetch Identity using the token
            const { data: { user } } = await supabaseClient.auth.getUser(token);
            if (user) {
                const { data: profile } = await supabaseClient.from('profiles').select('*').eq('id', user.id).maybeSingle();
                if (profile) {
                    document.getElementById('teacherNameDisplay').innerText = profile.full_name;
                    if (profile.is_pro) {
                        document.getElementById('proBadge').classList.remove('hidden');
                        document.getElementById('pro-card').classList.add('hidden');
                    } else {
                        document.getElementById('pro-card').classList.remove('hidden');
                    }
                }
            }
            loadDashboard(token);
        }

        async function loadDashboard(token) {
            const container = document.getElementById('assignments-container');
            try {
                const [aRes, sRes] = await Promise.all([
                    fetch(`${API_URL}/assignments`, { headers: { 'Authorization': `Bearer ${token}` } }).then(r => r.json()),
                    fetch(`${API_URL}/submissions`, { headers: { 'Authorization': `Bearer ${token}` } }).then(r => r.json())
                ]);
                container.innerHTML = (aRes.data || []).map(quiz => {
                    return `<div class="bg-white rounded-[2.5rem] shadow-xl border p-8 flex flex-col h-fit">
                        <h4 class="font-black text-slate-800 text-xl uppercase">${quiz.title}</h4>
                        <span class="bg-yellow-100 text-yellow-800 text-[10px] font-black px-2 py-0.5 rounded-full uppercase mt-2 w-fit">${quiz.short_code}</span>
                    </div>`;
                }).join('');
            } catch (e) { container.innerHTML = "Syncing Dashboard..."; }
        }

        async function handleLogout() {
            localStorage.clear();
            await supabaseClient.auth.signOut();
            window.location.href = 'login.html';
        }

        init();
    </script>
</body>
</html>
