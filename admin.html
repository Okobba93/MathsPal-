<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathsPal Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 font-sans p-4 text-slate-900 pb-20 leading-relaxed">
    <div class="max-w-md mx-auto space-y-6">
        
        <!-- HEADER -->
        <div class="flex justify-between items-center bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100">
            <h1 class="text-3xl font-black italic tracking-tighter text-slate-800">Maths<span class="text-yellow-500 underline">Pal</span></h1>
            <div class="text-right">
                <p id="teacherNameDisplay" class="font-black text-sm text-slate-600 italic">Professor</p>
                <div id="proBadge" class="hidden bg-blue-100 text-blue-600 px-3 py-1 rounded-full text-[9px] font-black uppercase tracking-widest mt-1 border border-blue-200 animate-pulse">💎 PRO MEMBER</div>
            </div>
        </div>

        <!-- GO PRO BANNER (Auto-hides) -->
        <div id="pro-card" class="bg-gradient-to-br from-blue-600 to-indigo-900 p-8 rounded-[3rem] shadow-2xl text-white relative overflow-hidden">
            <div class="relative z-10 space-y-4">
                <h2 class="text-3xl font-black italic leading-tight">Go Pro 🚀</h2>
                <p class="text-sm opacity-80 font-medium">Unlock unlimited analytics for KSh 200/month.</p>
                <button id="mpesaBtn" onclick="triggerPayment()" class="bg-yellow-400 text-slate-900 px-8 py-4 rounded-2xl font-black uppercase tracking-widest shadow-xl active:scale-95 transition">Upgrade with M-Pesa</button>
            </div>
            <div class="absolute -right-10 -bottom-10 w-40 h-40 bg-white/10 rounded-full"></div>
        </div>

        <div id="assignments-container" class="space-y-6"></div>
        <button onclick="localStorage.clear(); window.location.href='login.html'" class="w-full py-10 text-slate-300 font-black text-[10px] uppercase tracking-[0.5em]">Sign Out</button>
    </div>

    <script>
        const S_URL = 'https://ykdehazdwinllvjsmrd.supabase.co'; 
        const S_KEY = 'sb_publishable_Usp4A-ts9B6wBS1_XxJjVA_IZpwPMCn'; 
        const supabaseClient = supabase.createClient(S_URL, S_KEY);

        // THE FIX: Continuously check the database for the Diamond
        async function fetchProStatus() {
            const email = localStorage.getItem('mp_email');
            if (!email) return;

            const { data } = await supabaseClient.from('profiles').select('is_pro, full_name').eq('email', email).single();
            
            if (data && data.is_pro) {
                document.getElementById('proBadge').classList.remove('hidden');
                document.getElementById('pro-card').classList.add('hidden');
                document.getElementById('teacherNameDisplay').innerText = data.full_name;
            }
        }

        async function triggerPayment() {
            const phone = prompt("Enter M-Pesa Number (254...):");
            if (!phone) return;
            const res = await fetch('https://mathspal-backend.onrender.com/request-payment', {
                method: 'POST',
                body: new URLSearchParams({'phone': phone, 'email': localStorage.getItem('mp_email')})
            }).then(r => r.json());
            if (res.status === "success") alert("PIN Prompt Sent! Dashboard will unlock once paid.");
        }

        async function loadDashboard() {
            const container = document.getElementById('assignments-container');
            const token = localStorage.getItem('mp_session');
            try {
                const res = await fetch('https://mathspal-backend.onrender.com/assignments', { headers: { 'Authorization': `Bearer ${token}` } }).then(r => r.json());
                container.innerHTML = (res.data || []).map(q => `<div class="bg-white p-8 rounded-[2.5rem] shadow-lg border border-slate-100 flex flex-col gap-2">
                    <h4 class="font-black text-slate-800 text-lg uppercase">${q.title}</h4>
                    <span class="bg-yellow-100 text-yellow-800 text-[9px] font-black px-2 py-0.5 rounded-full uppercase italic w-fit">${q.short_code}</span>
                </div>`).join('');
            } catch (e) { console.log(e); }
        }

        if (!localStorage.getItem('mp_session')) window.location.href = 'login.html';
        fetchProStatus();
        loadDashboard();
        setInterval(fetchProStatus, 5000); // Check for Diamond every 5 seconds
    </script>
</body>
</html>
