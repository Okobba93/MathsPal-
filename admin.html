<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathsPal Admin - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans p-4 md:p-10 text-slate-900 pb-20 leading-relaxed">
    <div class="max-w-7xl mx-auto space-y-10">
        
        <!-- TOP NAV -->
        <div class="flex justify-between items-center bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100">
            <h1 class="text-3xl font-black italic tracking-tighter text-slate-800">Maths<span class="text-yellow-500 underline">Pal</span> Admin</h1>
            <div class="flex items-center gap-4 text-right">
                <div class="hidden md:block leading-none">
                    <p class="text-[8px] font-black text-slate-300 uppercase tracking-widest mb-1">Authenticated</p>
                    <p id="teacherNameDisplay" class="font-black text-sm text-slate-600 italic">---</p>
                </div>
                <button id="refBtn" onclick="loadDashboard()" class="bg-slate-900 text-white px-6 py-2.5 rounded-full text-[10px] font-black uppercase tracking-widest active:scale-95 transition">Refresh</button>
            </div>
        </div>
        
        <!-- QUIZ CREATOR -->
        <div class="max-w-md mx-auto md:mx-0 w-full">
            <details class="bg-slate-900 rounded-3xl overflow-hidden shadow-xl border-b-4 border-yellow-500 group">
                <summary class="p-5 font-black text-xs uppercase cursor-pointer text-yellow-400 text-center tracking-widest">➕ Create New Quiz</summary>
                <div class="bg-white p-6 space-y-4 rounded-b-3xl text-center border-t">
                    <input id="title" type="text" placeholder="Quiz Title (e.g. Algebra)" class="w-full p-4 border-2 border-slate-50 rounded-2xl outline-none font-bold bg-slate-50 focus:border-yellow-400">
                    <div id="q-list" class="max-h-60 overflow-y-auto pr-2"><div class="flex gap-2 mb-2"><input class="w-12 p-3 border rounded-xl q-num bg-white text-center font-black" value="1" readonly><input class="flex-1 p-3 border rounded-xl q-ans font-bold text-center uppercase" placeholder="Ans"></div></div>
                    <button onclick="addQ()" class="text-blue-600 font-black text-[10px] uppercase tracking-tighter">+ Add Question</button>
                    <button id="saveBtn" onclick="saveQuiz()" class="w-full py-4 bg-slate-900 text-yellow-400 rounded-2xl font-black shadow-lg uppercase tracking-widest">Generate Code</button>
                    <div id="codeBox" class="hidden bg-yellow-400 p-6 rounded-[2rem] text-center mt-4 font-black text-3xl italic text-slate-900">CODE: <span id="finalCode">---</span></div>
                </div>
            </details>
        </div>

        <h3 class="font-black text-sm uppercase tracking-[0.3em] text-slate-400 pl-2">My Secured Assignments</h3>
        
        <!-- RESPONSIVE GRID CONTAINER -->
        <div id="assignments-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
            <p class="col-span-full text-center text-slate-300 italic py-20 animate-pulse uppercase text-xs font-black tracking-widest">Verifying Security Session...</p>
        </div>

        <button onclick="handleLogout()" class="w-full py-10 text-slate-300 hover:text-red-500 font-black text-[10px] uppercase tracking-[0.5em] transition">Sign Out of Session</button>
    </div>

    <script>
        const API_URL = 'https://mathspal-backend.onrender.com';

        // 1. SECURITY & IDENTITY
        function checkUser() {
            const session = localStorage.getItem('mp_session');
            const name = localStorage.getItem('mp_name');
            if (!session) { 
                window.location.href = 'login.html'; 
            } else { 
                document.getElementById('teacherNameDisplay').innerText = name || "Professor"; 
                loadDashboard(); 
            }
        }

        function handleLogout() { localStorage.clear(); window.location.href = 'login.html'; }

        // 2. DASHBOARD LOGIC (With Isolation Headers)
        async function loadDashboard() {
            const container = document.getElementById('assignments-container');
            const btn = document.getElementById('refBtn');
            const session = localStorage.getItem('mp_session');
            
            btn.innerText = "WAIT...";
            try {
                // We pass the Bearer token to prove our identity to Render
                const [aRes, sRes] = await Promise.all([
                    fetch(`${API_URL}/assignments`, { headers: { 'Authorization': `Bearer ${session}` } }).then(r => r.json()),
                    fetch(`${API_URL}/submissions`, { headers: { 'Authorization': `Bearer ${session}` } }).then(r => r.json())
                ]);

                if (aRes.error === "Unauthorized") return handleLogout();

                const assignments = aRes.data || [], allSubs = sRes.data || [];
                
                if (assignments.length === 0) {
                    container.innerHTML = '<p class="col-span-full text-center text-slate-300 py-10 font-bold italic">No quizzes created in this account.</p>';
                } else {
                    container.innerHTML = assignments.map(quiz => {
                        const subs = allSubs.filter(s => s.assignment_id === quiz.id);
                        let stats = {};
                        subs.forEach(s => { if (s.results_json) { s.results_json.forEach(res => {
                            if (!stats[res.q]) stats[res.q] = { correct: 0, total: 0 };
                            stats[res.q].total++;
                            if (res.status === 'correct') stats[res.q].correct++;
                        }); }});

                        const totalQs = Object.keys(quiz.master_key).length;
                        const avg = subs.length > 0 ? Math.round((subs.reduce((a,b) => a + (b.score || 0), 0) / (subs.length * totalQs)) * 100) : 0;
                        
                        return `
                        <div class="bg-white rounded-[2.5rem] shadow-xl border border-slate-100 overflow-hidden flex flex-col h-fit">
                            <div class="p-8 space-y-4">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <h4 class="font-black text-slate-800 text-xl tracking-tighter uppercase">${quiz.title || 'Untitled'}</h4>
                                        <span class="bg-yellow-100 text-yellow-800 text-[10px] font-black px-2 py-0.5 rounded-full tracking-widest uppercase italic">${quiz.short_code}</span>
                                    </div>
                                    <div id="del-zone-${quiz.id}">
                                        <button onclick="confirmDelete('${quiz.id}')" class="text-slate-200 hover:text-red-400 font-black text-[9px] uppercase tracking-widest">Delete</button>
                                    </div>
                                </div>
                                <div class="flex justify-between items-end pt-4">
                                    <div class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${subs.length} Students</div>
                                    <div class="text-right leading-none">
                                        <p class="text-[8px] font-black text-slate-300 uppercase mb-1">Class Avg</p>
                                        <p class="text-2xl font-black ${avg < 50 && subs.length > 0 ? 'text-red-500' : 'text-green-600'}">${avg}%</p>
                                    </div>
                                </div>
                            </div>
                            <details class="border-t border-slate-50 group">
                                <summary class="p-4 text-center list-none cursor-pointer text-[9px] font-black text-blue-500 uppercase tracking-widest hover:bg-slate-50 transition">View Analytics</summary>
                                <div class="p-6 bg-slate-50 space-y-6">
                                    <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-200">
                                        <table class="w-full text-left text-[10px]">
                                            <thead class="bg-slate-100 text-slate-400 font-black uppercase">
                                                <tr><th class="p-3">Q#</th><th class="p-3 text-center">Correct</th><th class="p-3 text-right">Pass %</th></tr>
                                            </thead>
                                            <tbody class="divide-y divide-slate-100 font-bold">
                                                ${Object.keys(stats).sort((a,b)=>a-b).map(qNum => {
                                                    const s = stats[qNum];
                                                    const rate = Math.round((s.correct / s.total) * 100);
                                                    return `<tr><td class="p-3 text-slate-500">Q${qNum}</td><td class="p-3 text-center text-green-600">${s.correct}/${s.total}</td><td class="p-3 text-right font-black ${rate < 50 ? 'text-red-600' : 'text-slate-900'}">${rate}% ${rate<50 ? '🚩':''}</td></tr>`
                                                }).join('')}
                                            </tbody>
                                        </table>
                                    </div>
                                    <div class="space-y-2 max-h-40 overflow-y-auto pr-1">
                                        ${subs.map(s => `<div class="flex justify-between p-3 bg-white rounded-xl text-[10px] shadow-sm border border-slate-50 uppercase font-black"><span>${s.student_name}</span> <span class="text-slate-400">${s.score}/${totalQs}</span></div>`).join('')}
                                    </div>
                                </div>
                            </details>
                        </div>`;
                    }).join('');
                }
            } catch (e) { container.innerHTML = "Security session error."; }
            btn.innerText = "REFRESH";
        }

        // --- QUIZ CREATOR ---
        function addQ() {
            const list = document.getElementById('q-list');
            const num = list.children.length + 1;
            const div = document.createElement('div');
            div.className = "flex gap-2 mb-2";
            div.innerHTML = `<input class="w-12 p-3 border rounded-xl q-num text-center font-black text-slate-300" value="${num}" readonly><input class="flex-1 p-3 border rounded-xl q-ans font-bold text-center uppercase" placeholder="Ans">`;
            list.appendChild(div);
            list.scrollTop = list.scrollHeight;
        }

        async function saveQuiz() {
            const btn = document.getElementById('saveBtn');
            const title = document.getElementById('title').value;
            const session = localStorage.getItem('mp_session');
            if(!title) return alert("Title required!");
            
            btn.innerText = "SAVING...";
            const answers = {};
            document.querySelectorAll('.q-ans').forEach((input, i) => { if(input.value) answers[i+1] = input.value; });
            
            const fd = new FormData();
            fd.append('title', title);
            fd.append('master_key', JSON.stringify(answers));

            try {
                const res = await fetch(`${API_URL}/create-assignment`, { 
                    method: 'POST', 
                    body: fd,
                    headers: { 'Authorization': `Bearer ${session}` } 
                }).then(r => r.json());
                
                document.getElementById('finalCode').innerText = res.short_code;
                document.getElementById('codeBox').classList.remove('hidden');
                btn.innerText = "GENERATE CODE";
                loadDashboard();
            } catch (e) { alert("Save error."); btn.innerText = "GENERATE CODE"; }
        }

        // --- DELETE WITH CONFIRM ---
        function confirmDelete(id) {
            const zone = document.getElementById(`del-zone-${id}`);
            zone.innerHTML = `<div class="flex gap-2"><button onclick="actuallyDelete('${id}')" class="text-red-600 font-black text-[10px]"><b>CONFIRM</b></button><button onclick="loadDashboard()" class="text-slate-300 font-bold text-[10px]">CANCEL</button></div>`;
        }

        async function actuallyDelete(id) {
            const session = localStorage.getItem('mp_session');
            const fd = new FormData();
            fd.append('assignment_id', id);
            await fetch(`${API_URL}/delete-assignment`, { 
                method: 'POST', 
                body: fd,
                headers: { 'Authorization': `Bearer ${session}` } 
            });
            loadDashboard();
        }

        // --- START ---
        checkUser();
    </script>
</body>
</html>
