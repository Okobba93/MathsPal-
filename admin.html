<!-- Copy and replace your admin.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathsPal Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 font-sans p-4 text-slate-900 pb-20">
    <div id="loading-screen" class="fixed inset-0 bg-white z-50 flex items-center justify-center">
        <div class="text-center">
            <div class="border-4 border-slate-100 border-t-yellow-500 rounded-full w-10 h-10 animate-spin mx-auto mb-4"></div>
            <p id="debug-status" class="font-black text-[10px] uppercase tracking-widest text-slate-400">Verifying Identity...</p>
        </div>
    </div>

    <div class="max-w-md mx-auto space-y-6">
        <div class="flex justify-between items-center pt-4">
            <h1 class="text-3xl font-black italic tracking-tighter">Maths<span class="text-yellow-500 underline">Pal</span></h1>
            <p id="teacherName" class="font-black text-xs text-slate-400 italic">Professor</p>
        </div>
        <div id="assignments-container" class="space-y-4"></div>
        <button onclick="logout()" class="w-full py-10 text-slate-300 font-bold text-[10px] uppercase tracking-[0.3em]">Sign Out</button>
    </div>

    <script>
        const API_URL = 'https://mathspal-backend.onrender.com';

        function checkAuth() {
            // 1. Try to get token from URL (The Loop Breaker)
            const urlParams = new URLSearchParams(window.location.search);
            let token = urlParams.get('token');
            let name = urlParams.get('name');

            // 2. If not in URL, try localStorage
            if (!token) {
                token = localStorage.getItem('mp_session');
                name = localStorage.getItem('mp_name');
            }

            // 3. If we still have no token, GO TO LOGIN
            if (!token) {
                window.location.href = 'login.html';
                return;
            }

            // 4. We are in! Save it for next time
            localStorage.setItem('mp_session', token);
            localStorage.setItem('mp_name', name || 'Professor');
            
            document.getElementById('loading-screen').classList.add('hidden');
            document.getElementById('teacherName').innerText = name || "Professor";
            loadDashboard(token);
        }

        async function loadDashboard(token) {
            const container = document.getElementById('assignments-container');
            try {
                const res = await fetch(`${API_URL}/assignments`, { 
                    headers: { 'Authorization': `Bearer ${token}` } 
                }).then(r => r.json());
                
                if (res.status === "success") {
                    container.innerHTML = res.data.map(q => `
                        <div class="bg-white p-6 rounded-[2rem] shadow-xl border border-slate-50">
                            <h4 class="font-black text-slate-800 uppercase text-sm">${q.title}</h4>
                            <span class="bg-yellow-100 text-yellow-800 text-[9px] px-2 py-1 rounded-full font-bold uppercase mt-2 inline-block italic">${q.short_code}</span>
                        </div>
                    `).join('');
                }
            } catch (e) { container.innerHTML = "<p class='text-center text-xs text-slate-300'>Dashboard Empty</p>"; }
        }

        function logout() {
            localStorage.clear();
            window.location.href = 'login.html';
        }

        checkAuth();
    </script>
</body>
</html>
