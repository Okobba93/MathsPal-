<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathsPal Admin - Pro Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>
<body class="bg-slate-50 font-sans p-4 md:p-10 text-slate-900 pb-20 leading-relaxed">
    <div class="max-w-7xl mx-auto space-y-8">
        
        <!-- TOP NAV -->
        <div class="flex justify-between items-center bg-white p-6 rounded-[2.5rem] shadow-sm border border-slate-100">
            <h1 class="text-3xl font-black italic tracking-tighter text-slate-800 leading-none">Maths<span class="text-yellow-500 underline decoration-wavy decoration-slate-900">Pal</span></h1>
            <div class="text-right">
                <p id="teacherNameDisplay" class="font-black text-sm text-slate-600 italic leading-none">Professor</p>
                <div id="proBadge" class="hidden animate-bounce inline-block bg-blue-100 text-blue-600 px-3 py-1 rounded-full text-[9px] font-black uppercase tracking-widest mt-2 border border-blue-200 shadow-sm">💎 PRO MEMBER</div>
            </div>
        </div>

        <!-- GO PRO BANNER (Auto-hides when Pro) -->
        <div id="pro-card" class="bg-gradient-to-br from-blue-600 to-indigo-900 p-8 rounded-[3rem] shadow-2xl text-white relative overflow-hidden">
            <div class="relative z-10 space-y-4">
                <div class="inline-block bg-white/20 px-3 py-1 rounded-full text-[10px] font-black uppercase tracking-[0.2em] mb-2">Exclusive Offer</div>
                <h2 class="text-4xl font-black italic leading-tight">Unlock MathsPal Pro 🚀</h2>
                <p class="text-sm opacity-80 max-w-sm font-medium text-slate-100">Get unlimited quizzes, advanced analytics, and automated CBE reporting for just KSh 200/month.</p>
                <button id="mpesaBtn" onclick="triggerPayment()" class="bg-yellow-400 text-slate-900 px-10 py-5 rounded-[2rem] font-black text-lg uppercase tracking-widest shadow-xl shadow-yellow-400/20 active:scale-95 transition">Upgrade with M-Pesa</button>
            </div>
            <div class="absolute -right-10 -bottom-10 w-60 h-60 bg-white/5 rounded-full"></div>
        </div>
        
        <!-- DASHBOARD GRID -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8 items-start">
            
            <!-- LEFT: QUIZ CREATOR -->
            <div class="lg:col-span-1">
                <div class="bg-white p-8 rounded-[2.5rem] shadow-xl border border-slate-100 space-y-6">
                    <h2 class="font-black text-[10px] uppercase tracking-widest text-slate-400">New Assignment</h2>
                    <input id="title" type="text" placeholder="Quiz Title (e.g. Algebra)" class="w-full p-4 border-2 border-slate-50 rounded-2xl bg-slate-50 outline-none focus:border-yellow-400 font-bold">
                    <div id="q-list" class="max-h-60 overflow-y-auto pr-2 space-y-3">
                        <div class="flex gap-2 items-center">
                            <span class="w-6 font-black text-slate-200 text-xs">1.</span>
                            <input class="flex-1 p-3 border rounded-xl q-ans font-bold" placeholder="Correct Ans">
                        </div>
                    </div>
                    <button onclick="addQ()" class="text-blue-600 font-black text-[10px] uppercase tracking-widest">+ Add Question</button>
                    <button id="saveBtn" onclick="saveQuiz()" class="w-full py-5 bg-slate-900 text-yellow-400 rounded-3xl font-black text-xl shadow-lg active:scale-95 transition uppercase tracking-widest leading-none">Generate Code</button>
                    <div id="codeBox" class="hidden bg-yellow-400 p-6 rounded-[2rem] text-center shadow-inner mt-4">
                        <p class="text-[10px] font-black uppercase text-yellow-900 opacity-60">Student Code</p>
                        <h3 id="finalCode" class="text-5xl font-black text-slate-900 tracking-tighter">---</h3>
                    </div>
                </div>
            </div>

            <!-- RIGHT: ACTIVE QUIZZES -->
            <div class="lg:col-span-2 space-y-6">
                <h3 class="font-black text-sm uppercase tracking-[0.3em] text-slate-400 pl-4">Class Performance</h3>
                <div id="assignments-container" class="grid grid-cols-1 md:grid-cols-2 gap-6 pb-20">
                    <p class="col-span-full text-center text-slate-300 italic py-20 font-bold uppercase text-xs tracking-widest">Waking up the dashboard...</p>
                </div>
            </div>
        </div>

        <button onclick="localStorage.clear(); window.location.href='login.html'" class="w-full py-10 text-slate-300 hover:text-red-500 font-black text-[10px] uppercase tracking-[0.5em] transition">Sign Out of Session</button>
    </div>

    <script>
        const API_URL = 'https://mathspal-backend.onrender.com';
        const S_URL = 'https://ykdehazdwinllvjsmrd.supabase.co'; 
        const S_KEY = 'sb_publishable_Usp4A-ts9B6wBS1_XxJjVA_IZpwPMCn'; 
        const supabaseClient = supabase.createClient(S_URL, S_KEY);

        // --- 1. AUTOMATED PRO STATUS CHECK ---
        async function checkProStatus() {
            const email = localStorage.getItem('mp_email');
            if (!email) return;

            const { data } = await supabaseClient.from('profiles').select('is_pro, full_name').eq('email', email).single();
            
            if (data && data.is_pro) {
                document.getElementById('proBadge').classList.remove('hidden');
                document.getElementById('pro-card').classList.add('hidden');
                localStorage.setItem('mp_is_pro', 'true');
            }
            if (data) document.getElementById('teacherNameDisplay').innerText = data.full_name;
        }

        async function triggerPayment() {
            const phone = prompt("Enter M-Pesa Number (e.g. 254712345678):");
            if (!phone) return;
            document.getElementById('mpesaBtn').innerText = "WAITING FOR PIN...";
            
            const fd = new FormData();
            fd.append('phone', phone);
            fd.append('email', localStorage.getItem('mp_email'));

            try {
                const res = await fetch(`${API_URL}/request-payment`, { method: 'POST', body: fd }).then(r => r.json());
                if (res.status === "success") {
                    alert("STK PUSH SENT! Enter your M-Pesa PIN. The Diamond Badge will appear automatically.");
                } else {
                    alert("M-Pesa Error: " + res.error);
                    document.getElementById('mpesaBtn').innerText = "Upgrade with M-Pesa";
                }
            } catch (e) { alert("Server busy. Try again."); }
        }

        async function loadDashboard() {
            const container = document.getElementById('assignments-container');
            const session = localStorage.getItem('mp_session');
            try {
                const [aRes, sRes] = await Promise.all([
                    fetch(`${API_URL}/assignments`, { headers: { 'Authorization': `Bearer ${session}` } }).then(r => r.json()),
                    fetch(`${API_URL}/submissions`, { headers: { 'Authorization': `Bearer ${session}` } }).then(r => r.json())
                ]);
                const assignments = aRes.data || [], allSubs = sRes.data || [];
                
                if (assignments.length === 0) {
                    container.innerHTML = '<p class="col-span-full text-center text-slate-300 py-20 font-bold italic border-2 border-dashed border-slate-200 rounded-[2.5rem]">No quizzes yet. Create your first one above!</p>';
                } else {
                    container.innerHTML = assignments.map(quiz => {
                        const subs = allSubs.filter(s => s.assignment_id === quiz.id);
                        let stats = {};
                        subs.forEach(s => { if (s.results_json) { s.results_json.forEach(res => {
                            if (!stats[res.q]) stats[res.q] = { correct: 0, total: 0 };
                            stats[res.q].total++;
                            if (res.status === 'correct') stats[res.q].correct++;
                        }); }});
                        const totalQs = Object.keys(quiz.master_key).length;
                        const avg = subs.length > 0 ? Math.round((subs.reduce((a,b) => a + (b.score || 0), 0) / (subs.length * totalQs)) * 100) : 0;
                        
                        return `
                        <div class="bg-white rounded-[2.5rem] shadow-xl border border-slate-100 overflow-hidden flex flex-col h-fit">
                            <div class="p-8 space-y-4">
                                <div class="flex justify-between items-start">
                                    <div>
                                        <h4 class="font-black text-slate-800 text-lg uppercase leading-tight">${quiz.title || 'Untitled'}</h4>
                                        <span class="bg-yellow-100 text-yellow-800 text-[9px] font-black px-2 py-0.5 rounded-full uppercase italic tracking-widest">${quiz.short_code}</span>
                                    </div>
                                    <button onclick="confirmDelete('${quiz.id}')" id="del-${quiz.id}" class="text-slate-200 hover:text-red-400 font-black text-[9px] uppercase tracking-widest">Delete</button>
                                </div>
                                <div class="flex justify-between items-end mt-4">
                                    <p class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">${subs.length} Students</p>
                                    <div class="text-right leading-none">
                                        <p class="text-[20px] font-black ${avg < 50 && subs.length > 0 ? 'text-red-500' : 'text-green-600'} leading-none">${avg}%</p>
                                        <p class="text-[7px] font-black text-slate-300 uppercase mt-1">Class Avg</p>
                                    </div>
                                </div>
                            </div>
                            <details class="border-t border-slate-50 group">
                                <summary class="p-4 text-center list-none cursor-pointer text-[9px] font-black text-blue-500 uppercase tracking-widest hover:bg-slate-50 transition">View Analytics</summary>
                                <div class="p-6 bg-slate-50 space-y-6">
                                    <div class="bg-white rounded-2xl overflow-hidden shadow-sm border border-slate-100">
                                        <table class="w-full text-left text-[10px]">
                                            <thead class="bg-slate-100 text-slate-400 font-black uppercase"><tr><th class="p-3">Q#</th><th class="p-3 text-center">Correct</th><th class="p-3 text-right">Pass %</th></tr></thead>
                                            <tbody class="divide-y divide-slate-100">
                                                ${Object.keys(stats).sort((a,b)=>a-b).map(qNum => {
                                                    const s = stats[qNum];
                                                    const rate = Math.round((s.correct / s.total) * 100);
                                                    return `<tr><td class="p-3 font-bold text-slate-500 font-mono">Q${qNum}</td><td class="p-3 text-center text-green-600 font-bold">${s.correct}/${s.total}</td><td class="p-3 text-right font-black ${rate < 50 ? 'text-red-600' : 'text-slate-900'}">${rate}% ${rate<50 ? '🚩':''}</td></tr>`
                                                }).join('')}
                                            </tbody>
                                        </table>
                                    </div>
                                    <div class="space-y-2 max-h-40 overflow-y-auto pr-1">
                                        ${subs.map(s => `<div class="flex justify-between p-3 bg-white rounded-xl text-[10px] shadow-sm border border-slate-100 uppercase font-black tracking-tight"><span>${s.student_name}</span> <span class="text-slate-400 font-mono">${s.score}/${totalQs}</span></div>`).join('')}
                                    </div>
                                </div>
                            </details>
                        </div>`;
                    }).join('');
                }
            } catch (e) { container.innerHTML = "Dashboard connection paused."; }
        }

        function addQ() {
            const list = document.getElementById('q-list');
            const num = list.children.length + 1;
            const div = document.createElement('div');
            div.className = "flex gap-2 items-center mt-2";
            div.innerHTML = `<span class="w-6 font-black text-slate-300 text-xs">${num}.</span><input class="flex-1 p-3 border rounded-xl q-ans font-bold text-center uppercase" placeholder="Ans">`;
            list.appendChild(div);
            list.scrollTop = list.scrollHeight;
        }

        async function saveQuiz() {
            const btn = document.getElementById('saveBtn');
            const title = document.getElementById('title').value;
            const session = localStorage.getItem('mp_session');
            if(!title) return alert("Give your quiz a title!");
            btn.innerText = "SAVING...";
            const answers = {};
            document.querySelectorAll('.q-ans').forEach((input, i) => { if(input.value) answers[i+1] = input.value; });
            const fd = new FormData();
            fd.append('title', title);
            fd.append('master_key', JSON.stringify(answers));
            const res = await fetch(`${API_URL}/create-assignment`, { method: 'POST', body: fd, headers: { 'Authorization': `Bearer ${session}` } }).then(r => r.json());
            document.getElementById('finalCode').innerText = res.short_code;
            document.getElementById('codeBox').classList.remove('hidden');
            btn.innerText = "GENERATE CODE";
            loadDashboard();
        }

        function confirmDelete(id) {
            const btn = document.getElementById(`del-${id}`);
            btn.innerHTML = `<b>CONFIRM?</b>`;
            btn.className = "text-red-600 font-black text-[9px] uppercase tracking-widest";
            btn.onclick = () => actuallyDelete(id);
        }

        async function actuallyDelete(id) {
            const session = localStorage.getItem('mp_session');
            const fd = new FormData();
            fd.append('assignment_id', id);
            await fetch(`${API_URL}/delete-assignment`, { method: 'POST', body: fd, headers: { 'Authorization': `Bearer ${session}` } });
            loadDashboard();
        }

        // --- START THE AUTO-MONITORING ---
        if (!localStorage.getItem('mp_session')) window.location.href = 'login.html';
        checkProStatus();
        loadDashboard();
        setInterval(checkProStatus, 5000); // Heartbeat: Am I Pro yet?
        setInterval(loadDashboard, 20000); // Heartbeat: Refresh Class Analytics
    </script>
</body>
</html>
