<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="theme-color" content="#fbbf24">
    <meta name="description" content="MathsPal Student Mathematics Assignment Marker">

    <title>MathsPal Student App</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        .tick {
            stroke: #fbbf24;
            stroke-width: 10;
            fill: none;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        .red-x {
            stroke: #ef4444;
            stroke-width: 10;
            fill: none;
            stroke-linecap: round;
        }

        .loader {
            border: 6px solid #f3f3f3;
            border-top: 6px solid #fbbf24;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        .hidden {
            display: none !important;
        }

        video {
            width: 100%;
            border-radius: 24px;
            background: black;
        }

        .pop-in {
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
        }

        @keyframes pop {
            0% {
                transform: scale(0.8);
                opacity: 0;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
    </style>
</head>

<body class="bg-slate-50 text-slate-900 font-sans">

    <!-- ========================================================= -->
    <!-- 1. ENTRY SCREEN                                           -->
    <!-- ========================================================= -->

    <div
        id="view-landing"
        class="min-h-screen flex flex-col items-center justify-center p-6 text-center space-y-6"
    >

        <h1 class="text-5xl font-black italic">
            Maths<span class="text-yellow-500 underline">Pal</span>
        </h1>

        <div
            class="bg-white p-8 rounded-3xl shadow-xl w-full max-w-xs space-y-4 border border-slate-100"
        >

            <!-- CLASS CODE -->
            <input
                id="codeInput"
                type="text"
                placeholder="CLASS CODE"
                autocomplete="off"
                class="w-full p-4 border-2 border-slate-100 rounded-2xl text-center font-black uppercase outline-none focus:border-yellow-400"
            >

            <!-- STUDENT NAME -->
            <input
                id="nameInput"
                type="text"
                placeholder="YOUR NAME"
                autocomplete="name"
                class="w-full p-4 border-2 border-slate-100 rounded-2xl text-center font-bold outline-none focus:border-yellow-400"
            >

            <!-- FILE AREA -->
            <div
                class="border-4 border-dashed border-slate-100 p-6 rounded-2xl space-y-4 relative"
            >

                <p
                    id="statusLabel"
                    class="font-bold text-slate-400 text-[10px] uppercase"
                >
                    Upload Answer Sheet PDF
                </p>

                <div class="flex gap-2">

                    <!-- CAMERA -->
                    <button
                        onclick="openCamera()"
                        type="button"
                        class="flex-1 bg-yellow-400 py-4 rounded-xl text-xl shadow-md active:scale-95 transition"
                    >
                        📸
                    </button>

                    <!-- GALLERY -->
                    <button
                        onclick="document.getElementById('galleryIn').click()"
                        type="button"
                        class="flex-1 bg-slate-900 text-white py-4 rounded-xl text-xl shadow-md active:scale-95 transition"
                    >
                        🖼️
                    </button>

                </div>

                <!-- RESET -->
                <button
                    id="resetBtn"
                    onclick="resetApp()"
                    type="button"
                    class="hidden absolute -top-4 -right-2 bg-red-500 text-white w-8 h-8 rounded-full font-black shadow-lg"
                >
                    ✕
                </button>

                <!-- FILE INPUT -->
                <!--
                    One file per grading attempt.
                    A multi-page PDF is perfectly fine.
                -->
                <input
                    type="file"
                    id="galleryIn"
                    class="hidden"
                    accept="image/*,.pdf,application/pdf"
                    onchange="addGalleryFile(this.files)"
                />

            </div>

            <!-- GRADE -->
            <button
                id="gradeBtn"
                onclick="handleGrade()"
                type="button"
                class="w-full py-4 bg-slate-900 text-yellow-400 rounded-2xl font-black text-xl shadow-lg uppercase"
            >
                Grade Now
            </button>

            <p class="text-[9px] text-slate-400 font-bold uppercase leading-relaxed">
                Upload one complete PDF answer sheet or one clear page image.
            </p>

        </div>
    </div>


    <!-- ========================================================= -->
    <!-- 2. LIVE CAMERA                                            -->
    <!-- ========================================================= -->

    <div
        id="view-camera"
        class="hidden fixed inset-0 bg-black z-50 flex flex-col p-6 space-y-6"
    >

        <video
            id="video"
            autoplay
            playsinline
        ></video>

        <div class="flex justify-center gap-6">

            <button
                onclick="closeCamera()"
                type="button"
                class="px-6 py-3 bg-slate-700 text-white rounded-xl font-black uppercase text-xs"
            >
                Cancel
            </button>

            <button
                id="snapBtn"
                onclick="snap()"
                type="button"
                class="w-20 h-20 bg-white rounded-full border-8 border-slate-800 shadow-2xl active:scale-90 transition"
            ></button>

        </div>

    </div>


    <!-- ========================================================= -->
    <!-- 3. LOADING                                                -->
    <!-- ========================================================= -->

    <div
        id="view-loading"
        class="hidden min-h-screen flex flex-col items-center justify-center p-10 text-center space-y-4 bg-white"
    >

        <div class="loader"></div>

        <h2 class="text-xl font-bold italic">
            MathsPal is Processing...
        </h2>

        <p
            id="loadMsg"
            class="text-slate-400 text-xs font-bold uppercase tracking-widest"
        >
            Preparing your assignment...
        </p>

        <p
            id="loadSubMsg"
            class="text-slate-300 text-[10px] font-bold uppercase"
        >
            Please keep this page open.
        </p>

    </div>


    <!-- ========================================================= -->
    <!-- 4. RESULTS                                                -->
    <!-- ========================================================= -->

    <div
        id="view-preview"
        class="hidden min-h-screen bg-slate-800 pb-20 text-center"
    >

        <div
            class="bg-slate-900 text-white p-4 flex justify-between items-center sticky top-0 shadow-lg mb-6"
        >

            <button
                onclick="leaveGradingPage()"
                type="button"
                class="font-black text-xs uppercase text-yellow-400"
            >
                ← Exit
            </button>

            <span
                id="scoreBadge"
                class="bg-green-600 px-4 py-1 rounded-full font-black tracking-tighter italic text-sm"
            >
                --
            </span>

        </div>

        <div
            id="resultsList"
            class="p-6 flex flex-col items-center space-y-4"
        ></div>

    </div>


    <!-- ========================================================= -->
    <!-- JAVASCRIPT                                                -->
    <!-- ========================================================= -->

    <script>

        /*
         * ========================================================
         * MathsPal Student Frontend
         * ========================================================
         */

        const RENDER_URL =
            'https://mathspal-backend.onrender.com/grade';


        /*
         * Maximum upload size.
         *
         * This is intentionally generous because handwritten
         * assignment PDFs can be fairly large.
         */
        const MAX_FILE_SIZE =
            25 * 1024 * 1024;


        /*
         * Network timeout.
         *
         * OCR can take some time, especially for handwriting.
         * Five minutes prevents an infinite loading state.
         */
        const REQUEST_TIMEOUT =
            5 * 60 * 1000;


        let batch = [];

        let stream = null;

        let markedPdfUrl = null;

        let markedPdfBlob = null;


        /*
         * ========================================================
         * AUDIO
         * ========================================================
         */

        const tickSfx =
            new Audio(
                'https://assets.mixkit.co/active_storage/sfx/2000/2000-preview.mp3'
            );

        const errorSfx =
            new Audio(
                'https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3'
            );


        /*
         * ========================================================
         * VIEW SWITCHER
         * ========================================================
         */

        function switchView(view) {

            const views = [
                'landing',
                'camera',
                'loading',
                'preview'
            ];

            views.forEach(id => {

                const element =
                    document.getElementById('view-' + id);

                if (element) {
                    element.classList.add('hidden');
                }

            });

            const target =
                document.getElementById('view-' + view);

            if (target) {
                target.classList.remove('hidden');
            }
        }


        /*
         * ========================================================
         * FILE TYPE CHECK
         * ========================================================
         */

        function isPdf(file) {

            if (!file) return false;

            const name =
                String(file.name || '').toLowerCase();

            return (
                file.type === 'application/pdf' ||
                name.endsWith('.pdf')
            );
        }


        /*
         * ========================================================
         * SAFE IMAGE COMPRESSION
         *
         * IMPORTANT:
         * This version can NEVER remain pending forever because
         * every major failure path resolves/rejects.
         * ========================================================
         */

        async function compress(file) {

            if (!file) {
                throw new Error('No image was selected.');
            }

            /*
             * PDFs must never enter this function.
             */
            if (isPdf(file)) {
                return file;
            }


            /*
             * If the image is already reasonably small,
             * keep the original.
             *
             * This also saves processing time on phones.
             */
            if (file.size <= 2 * 1024 * 1024) {
                return file;
            }


            return new Promise((resolve, reject) => {

                const reader =
                    new FileReader();


                /*
                 * FileReader error.
                 */
                reader.onerror = () => {

                    reject(
                        new Error(
                            'The phone could not read the selected image.'
                        )
                    );

                };


                /*
                 * Successful FileReader.
                 */
                reader.onload = event => {

                    const img =
                        new Image();


                    /*
                     * Image failed to decode.
                     */
                    img.onerror = () => {

                        reject(
                            new Error(
                                'The selected image could not be opened.'
                            )
                        );

                    };


                    /*
                     * Image loaded.
                     */
                    img.onload = () => {

                        try {

                            let width =
                                img.naturalWidth ||
                                img.width;

                            let height =
                                img.naturalHeight ||
                                img.height;


                            if (!width || !height) {

                                reject(
                                    new Error(
                                        'Invalid image dimensions.'
                                    )
                                );

                                return;
                            }


                            /*
                             * Maximum working width.
                             *
                             * 1600 gives OCR more detail than the
                             * previous 1200 setting while keeping
                             * phone uploads manageable.
                             */
                            const MAX_WIDTH = 1600;


                            if (width > MAX_WIDTH) {

                                const ratio =
                                    MAX_WIDTH / width;

                                width =
                                    Math.round(
                                        width * ratio
                                    );

                                height =
                                    Math.round(
                                        height * ratio
                                    );
                            }


                            const canvas =
                                document.createElement('canvas');


                            canvas.width =
                                width;

                            canvas.height =
                                height;


                            const context =
                                canvas.getContext('2d');


                            if (!context) {

                                reject(
                                    new Error(
                                        'Your browser could not prepare the image.'
                                    )
                                );

                                return;
                            }


                            /*
                             * White background prevents transparent
                             * images becoming black after conversion.
                             */
                            context.fillStyle =
                                '#ffffff';

                            context.fillRect(
                                0,
                                0,
                                width,
                                height
                            );


                            context.drawImage(
                                img,
                                0,
                                0,
                                width,
                                height
                            );


                            canvas.toBlob(
                                blob => {

                                    if (!blob) {

                                        reject(
                                            new Error(
                                                'Image compression failed.'
                                            )
                                        );

                                        return;
                                    }


                                    const outputName =
                                        file.name
                                            .replace(/\.[^/.]+$/, '') +
                                        '.jpg';


                                    const compressedFile =
                                        new File(
                                            [blob],
                                            outputName,
                                            {
                                                type: 'image/jpeg',
                                                lastModified:
                                                    Date.now()
                                            }
                                        );


                                    resolve(
                                        compressedFile
                                    );

                                },
                                'image/jpeg',
                                0.78
                            );

                        } catch (error) {

                            reject(error);

                        }

                    };


                    /*
                     * Start loading the image.
                     */
                    img.src =
                        event.target.result;
                };


                /*
                 * Start reading.
                 */
                try {

                    reader.readAsDataURL(file);

                } catch (error) {

                    reject(error);

                }

            });
        }


        /*
         * ========================================================
         * CAMERA
         * ========================================================
         */

        async function openCamera() {

            try {

                if (
                    !navigator.mediaDevices ||
                    !navigator.mediaDevices.getUserMedia
                ) {

                    alert(
                        'Camera access is not supported by this browser.'
                    );

                    return;
                }


                stream =
                    await navigator.mediaDevices.getUserMedia({
                        video: {
                            facingMode: {
                                ideal: 'environment'
                            }
                        },
                        audio: false
                    });


                const video =
                    document.getElementById('video');


                video.srcObject =
                    stream;


                switchView('camera');

            } catch (error) {

                console.error(
                    'Camera error:',
                    error
                );

                alert(
                    'Camera could not be opened. Please allow camera permission or use the gallery button.'
                );
            }
        }


        /*
         * ========================================================
         * CLOSE CAMERA
         * ========================================================
         */

        function closeCamera() {

            if (stream) {

                stream
                    .getTracks()
                    .forEach(track => track.stop());

                stream = null;
            }

            const video =
                document.getElementById('video');

            if (video) {
                video.srcObject = null;
            }

            switchView('landing');
        }


        /*
         * ========================================================
         * TAKE CAMERA PHOTO
         * ========================================================
         */

        async function snap() {

            const video =
                document.getElementById('video');

            const snapButton =
                document.getElementById('snapBtn');


            if (
                !video ||
                !video.videoWidth ||
                !video.videoHeight
            ) {

                alert(
                    'Camera is not ready yet. Please wait a moment and try again.'
                );

                return;
            }


            snapButton.disabled = true;


            try {

                const canvas =
                    document.createElement('canvas');


                canvas.width =
                    video.videoWidth;

                canvas.height =
                    video.videoHeight;


                const context =
                    canvas.getContext('2d');


                context.drawImage(
                    video,
                    0,
                    0,
                    canvas.width,
                    canvas.height
                );


                const blob =
                    await new Promise(
                        (resolve, reject) => {

                            canvas.toBlob(
                                result => {

                                    if (result) {
                                        resolve(result);
                                    } else {
                                        reject(
                                            new Error(
                                                'Camera image could not be created.'
                                            )
                                        );
                                    }

                                },
                                'image/jpeg',
                                0.85
                            );

                        }
                    );


                const originalFile =
                    new File(
                        [blob],
                        'MathsPal-Camera-Page.jpg',
                        {
                            type: 'image/jpeg'
                        }
                    );


                const compressedFile =
                    await compress(
                        originalFile
                    );


                batch = [
                    compressedFile
                ];


                updateUI();


                if (stream) {

                    stream
                        .getTracks()
                        .forEach(track => track.stop());

                    stream = null;
                }


                video.srcObject = null;


                switchView('landing');

            } catch (error) {

                console.error(
                    'Camera capture error:',
                    error
                );

                alert(
                    error.message ||
                    'Camera capture failed.'
                );

            } finally {

                snapButton.disabled = false;

            }
        }


        /*
         * ========================================================
         * GALLERY / FILE PICKER
         * ========================================================
         */

        async function addGalleryFile(fileList) {

            const status =
                document.getElementById('statusLabel');

            const input =
                document.getElementById('galleryIn');


            /*
             * Nothing selected.
             */
            if (!fileList || fileList.length === 0) {
                return;
            }


            /*
             * The MVP accepts ONE document per grading attempt.
             *
             * A multi-page PDF should be uploaded as one PDF.
             */
            if (fileList.length > 1) {

                alert(
                    'Please select ONE complete PDF answer sheet. A multi-page PDF is supported.'
                );

                if (input) {
                    input.value = '';
                }

                return;
            }


            const file =
                fileList[0];


            /*
             * Size protection.
             */
            if (file.size > MAX_FILE_SIZE) {

                alert(
                    'This file is too large. Please use a PDF/image smaller than 25 MB.'
                );

                if (input) {
                    input.value = '';
                }

                return;
            }


            try {

                status.innerText =
                    isPdf(file)
                        ? 'PDF READY — PREPARING...'
                        : 'PREPARING IMAGE...';


                /*
                 * PDF:
                 * Keep completely intact.
                 */
                if (isPdf(file)) {

                    batch = [file];

                } else {

                    /*
                     * Image:
                     * Compress safely.
                     */
                    const compressed =
                        await compress(file);

                    batch = [
                        compressed
                    ];
                }


                updateUI();


            } catch (error) {

                console.error(
                    'File preparation error:',
                    error
                );

                alert(
                    error.message ||
                    'The selected file could not be prepared.'
                );

                batch = [];


                status.innerText =
                    'Upload Answer Sheet PDF';


            } finally {

                /*
                 * Allows the user to select the same file again.
                 */
                if (input) {
                    input.value = '';
                }
            }
        }


        /*
         * ========================================================
         * UPDATE UPLOAD UI
         * ========================================================
         */

        function updateUI() {

            const status =
                document.getElementById('statusLabel');

            const reset =
                document.getElementById('resetBtn');


            if (batch.length === 0) {

                status.innerText =
                    'Upload Answer Sheet PDF';

                reset.classList.add('hidden');

                return;
            }


            const file =
                batch[0];


            if (isPdf(file)) {

                status.innerText =
                    '✅ PDF READY';

            } else {

                status.innerText =
                    '✅ PAGE READY';
            }


            reset.classList.remove('hidden');
        }


        /*
         * ========================================================
         * RESET
         * ========================================================
         */

        function resetApp() {

            cleanupMarkedPdf();


            if (stream) {

                stream
                    .getTracks()
                    .forEach(track => track.stop());

                stream = null;
            }


            batch = [];


            const input =
                document.getElementById('galleryIn');

            if (input) {
                input.value = '';
            }


            const code =
                document.getElementById('codeInput');

            const name =
                document.getElementById('nameInput');


            if (code) {
                code.value = '';
            }

            if (name) {
                name.value = '';
            }


            switchView('landing');


            updateUI();
        }


        /*
         * ========================================================
         * GRADING
         * ========================================================
         */

        async function handleGrade() {

            const code =
                document
                    .getElementById('codeInput')
                    .value
                    .trim();


            const name =
                document
                    .getElementById('nameInput')
                    .value
                    .trim();


            /*
             * Basic validation.
             */
            if (!code) {

                alert(
                    'Please enter the class code.'
                );

                return;
            }


            if (!name) {

                alert(
                    'Please enter your name.'
                );

                return;
            }


            if (batch.length === 0) {

                alert(
                    'Please upload your answer sheet first.'
                );

                return;
            }


            /*
             * Only one document should be here.
             */
            const file =
                batch[0];


            /*
             * Disable button while grading.
             */
            const gradeButton =
                document.getElementById('gradeBtn');


            gradeButton.disabled = true;


            /*
             * Show loading screen.
             */
            switchView('loading');


            document
                .getElementById('loadMsg')
                .innerText =
                'Grading and preparing your marked PDF...';


            document
                .getElementById('loadSubMsg')
                .innerText =
                'Please keep this page open.';


            /*
             * Build multipart form.
             *
             * IMPORTANT:
             * Backend expects "file", NOT "files".
             */
            const formData =
                new FormData();


            formData.append(
                'student_name',
                name
            );


            formData.append(
                'short_code',
                code.toUpperCase()
            );


            formData.append(
                'file',
                file,
                file.name
            );


            /*
             * AbortController prevents an endless request.
             */
            const controller =
                new AbortController();


            const timeout =
                setTimeout(
                    () => controller.abort(),
                    REQUEST_TIMEOUT
                );


            try {

                const response =
                    await fetch(
                        RENDER_URL,
                        {
                            method: 'POST',
                            body: formData,
                            cache: 'no-store',
                            signal: controller.signal
                        }
                    );


                clearTimeout(timeout);


                /*
                 * HTTP error.
                 */
                if (!response.ok) {

                    let message =
                        'Grading failed.';


                    try {

                        const errorData =
                            await response.json();


                        if (
                            errorData &&
                            errorData.error
                        ) {

                            message =
                                errorData.error;

                        } else if (
                            errorData &&
                            errorData.detail
                        ) {

                            /*
                             * FastAPI commonly returns
                             * validation errors in "detail".
                             */
                            if (
                                Array.isArray(
                                    errorData.detail
                                )
                            ) {

                                message =
                                    'The uploaded file was not accepted by the grading server.';

                            } else {

                                message =
                                    errorData.detail;
                            }
                        }

                    } catch (_) {

                        /*
                         * Response was not JSON.
                         */
                        message =
                            'The grading server returned an unexpected response.';
                    }


                    throw new Error(message);
                }


                /*
                 * The backend should return the actual marked PDF.
                 */
                const blob =
                    await response.blob();


                if (
                    !blob ||
                    blob.size === 0
                ) {

                    throw new Error(
                        'MathsPal received an empty marked document.'
                    );
                }


                /*
                 * Keep PDF in memory only.
                 */
                markedPdfBlob =
                    blob;


                if (markedPdfUrl) {

                    URL.revokeObjectURL(
                        markedPdfUrl
                    );
                }


                markedPdfUrl =
                    URL.createObjectURL(
                        markedPdfBlob
                    );


                /*
                 * Score header.
                 */
                const score =
                    response.headers.get(
                        'X-MathsPal-Score'
                    ) || '--';


                document
                    .getElementById('scoreBadge')
                    .innerText =
                    'FINAL SCORE: ' + score;


                /*
                 * Show result.
                 */
                switchView('preview');


                showMarkedPdfReady();


            } catch (error) {

                clearTimeout(timeout);


                console.error(
                    'MathsPal grading error:',
                    error
                );


                let message =
                    'Connection Error.';


                if (
                    error &&
                    error.name === 'AbortError'
                ) {

                    message =
                        'MathsPal took too long to respond. Please try again.';

                } else if (
                    error &&
                    error.message
                ) {

                    message =
                        error.message;
                }


                /*
                 * Return to landing instead of
                 * reloading blindly.
                 */
                alert(message);


                switchView('landing');


                gradeButton.disabled = false;


                updateUI();
            }
        }


        /*
         * ========================================================
         * RESULT SCREEN
         * ========================================================
         */

        function showMarkedPdfReady() {

            const container =
                document.getElementById(
                    'resultsList'
                );


            container.innerHTML = `

                <div
                    class="bg-white rounded-[1.5rem] w-full max-w-[340px] p-7 shadow-2xl pop-in space-y-4"
                >

                    <div class="text-5xl">
                        📄
                    </div>

                    <h2 class="font-black text-xl uppercase">
                        Your marked work is ready
                    </h2>

                    <p
                        class="text-xs text-slate-400 font-bold leading-relaxed"
                    >
                        Your original work has been marked with a
                        yellow ✓ for correct answers and a bold red ✗
                        for incorrect answers.
                    </p>

                    <button
                        onclick="downloadMarkedPdf()"
                        type="button"
                        class="w-full py-4 bg-yellow-400 text-slate-900 rounded-2xl font-black shadow-xl uppercase tracking-widest"
                    >
                        Download Marked PDF
                    </button>

                    <button
                        onclick="leaveGradingPage()"
                        type="button"
                        class="w-full py-3 bg-slate-100 text-slate-700 rounded-2xl font-black uppercase text-xs"
                    >
                        Done / Exit
                    </button>

                </div>
            `;
        }


        /*
         * ========================================================
         * DOWNLOAD MARKED PDF
         * ========================================================
         */

        function downloadMarkedPdf() {

            if (!markedPdfUrl) {

                alert(
                    'The marked PDF is no longer available.'
                );

                return;
            }


            const link =
                document.createElement('a');


            link.href =
                markedPdfUrl;


            link.download =
                'MathsPal-Marked-Work.pdf';


            document.body.appendChild(
                link
            );


            link.click();


            link.remove();
        }


        /*
         * ========================================================
         * LEAVE GRADING PAGE
         * ========================================================
         */

        function leaveGradingPage() {

            cleanupMarkedPdf();

            location.reload();
        }


        /*
         * ========================================================
         * MEMORY CLEANUP
         * ========================================================
         */

        function cleanupMarkedPdf() {

            if (markedPdfUrl) {

                URL.revokeObjectURL(
                    markedPdfUrl
                );

                markedPdfUrl =
                    null;
            }


            markedPdfBlob =
                null;
        }


        /*
         * ========================================================
         * PAGE EXIT CLEANUP
         * ========================================================
         */

        window.addEventListener(
            'pagehide',
            () => {

                cleanupMarkedPdf();


                if (stream) {

                    stream
                        .getTracks()
                        .forEach(track => track.stop());

                    stream = null;
                }

            }
        );


        /*
         * ========================================================
         * INITIAL STATE
         * ========================================================
         */

        updateUI();

    </script>

</body>
</html>
