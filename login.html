<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MathsPal - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-white font-sans flex items-center justify-center min-h-screen p-6 text-center">
    <div class="w-full max-w-sm space-y-8">
        <h1 class="text-4xl font-black italic tracking-tighter">Maths<span class="text-yellow-500 underline">Pal</span> <span class="text-[10px] not-italic bg-white/10 px-2 py-1 rounded ml-1 uppercase tracking-widest">CBE</span></h1>
        
        <div class="bg-white text-slate-900 p-8 rounded-[2.5rem] shadow-2xl space-y-4 text-left border-b-8 border-yellow-400">
            <input id="name" type="text" placeholder="Full Name (For Signup)" class="w-full p-4 border-2 border-slate-50 rounded-2xl outline-none focus:border-yellow-400 font-bold">
            <input id="email" type="email" placeholder="Email Address" class="w-full p-4 border-2 border-slate-50 rounded-2xl outline-none focus:border-yellow-400 font-bold">
            
            <div class="relative">
                <input id="pass" type="password" placeholder="Password" class="w-full p-4 border-2 border-slate-50 rounded-2xl outline-none focus:border-yellow-400 font-bold">
                <button onclick="togglePass()" class="absolute right-4 top-4 text-slate-400 font-black text-[10px] uppercase">View</button>
            </div>

            <div class="flex gap-2 pt-2">
                <button onclick="handleAuth('login')" class="flex-1 py-4 bg-slate-900 text-white rounded-2xl font-black text-xs uppercase shadow-lg">Login</button>
                <button onclick="handleAuth('signup')" class="flex-1 py-4 bg-yellow-400 text-slate-900 rounded-2xl font-black text-xs uppercase shadow-lg">Sign Up</button>
            </div>
            <p id="msg" class="text-[10px] font-bold text-center uppercase pt-2 text-blue-500"></p>
        </div>
    </div>
    <script>
        const API_URL = 'https://mathspal-backend.onrender.com';
        function togglePass() {
            const p = document.getElementById('pass');
            p.type = p.type === 'password' ? 'text' : 'password';
        }
        async function handleAuth(type) {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('pass').value.trim();
            const name = document.getElementById('name').value.trim();
            const msg = document.getElementById('msg');
            if(!email || !password) return alert("Fill all fields");

            msg.innerText = "Connecting...";
            const fd = new FormData();
            fd.append('email', email); fd.append('password', password); fd.append('name', name);

            try {
                const res = await fetch(`${API_URL}/auth-${type}`, { method: 'POST', body: fd }).then(r => r.json());
                if (res.status === "success") {
                    if (type === 'login') {
                        // SAVE EVERYTHING FOR THE DASHBOARD
                        localStorage.setItem('mp_session', res.session);
                        localStorage.setItem('mp_email', email);
                        localStorage.setItem('mp_name', res.name);
                        window.location.href = `admin.html#token=${res.session}&name=${encodeURIComponent(res.name)}`;
                    } else { msg.innerText = "Signup Successful! Click Login."; }
                } else { msg.innerText = "Error: " + res.error; }
            } catch (e) { msg.innerText = "Network Error"; }
        }
    </script>
</body>
</html>
